# Site institucional SoluAux (soluaux.com.br)
# O HTTPS fica no Caddy do Admin (soluaux_caddy). Aqui só HTTP interno na rede soluaux_proxy.

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 1k;   # site estático: não recebe envios

    include /etc/nginx/snippets/seguranca.conf;

    # Número do WhatsApp vindo do .env (WHATSAPP_NUMERO), só dígitos.
    include /tmp/whatsapp.inc;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        limit_except GET { deny all; }   # GET e HEAD apenas
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Arquivos ocultos e de configuração nunca são servidos
    location ~ /\. { return 404; }

    error_page 404 /index.html;
}
